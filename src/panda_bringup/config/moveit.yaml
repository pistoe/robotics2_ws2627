robot_description_kinematics:
  panda_arm:
    kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.1
planning_pipelines: [ompl]
default_planning_pipeline: ompl
ompl:
  planning_plugins: [ompl_interface/OMPLPlanner]
  request_adapters:
    - default_planning_request_adapters/ResolveConstraintFrames
    - default_planning_request_adapters/ValidateWorkspaceBounds
    - default_planning_request_adapters/CheckStartStateBounds
    - default_planning_request_adapters/CheckStartStateCollision
  response_adapters:
    - default_planning_response_adapters/AddTimeOptimalParameterization
    - default_planning_response_adapters/ValidateSolution
    - default_planning_response_adapters/DisplayMotionPath
  planner_configs:
    RRTConnect:
      type: geometric::RRTConnect
      range: 0.0
  panda_arm:
    planner_configs: [RRTConnect]
    longest_valid_segment_fraction: 0.005
  panda_hand:
    planner_configs: [RRTConnect]
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false
moveit_simple_controller_manager:
  controller_names: [panda_arm_controller, panda_gripper]
  panda_gripper:
    type: GripperCommand
    action_ns: gripper_action
    default: true
    command_joint: panda_finger_joint1
    max_effort: 0.0
    joints: [panda_finger_joint1, panda_finger_joint2]
  panda_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 3.0
  allowed_start_tolerance: 0.01
publish_robot_description_semantic: true
publish_planning_scene: true
publish_geometry_updates: true
publish_state_updates: true
publish_transforms_updates: true
octomap_frame: world
octomap_resolution: 0.05
sensors: [disabled]
disabled:
  sensor_plugin: ""
